<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7454d8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Starry Day"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Starry Day ✨</title><style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#302b4c;background:#f8f5ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:580px;margin:auto;min-height:100dvh;padding-bottom:92px}.hero{background:linear-gradient(145deg,#7756d7,#a66bda 65%,#e59ac6);color:white;padding:25px 20px 26px;border-radius:0 0 32px 32px}.top{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:12px;letter-spacing:1.8px;opacity:.85}.hero h1{margin:8px 0 4px;font-size:30px}.hero p{margin:4px 0 14px;opacity:.95}.stars{background:#ffffff25;border:1px solid #ffffff45;border-radius:20px;padding:15px;display:flex;justify-content:space-between;align-items:center}.big{font-size:27px;font-weight:850}.tiny{font-size:12px;opacity:.9}.section{padding:16px 17px 0}.datebar{display:flex;gap:8px;align-items:center;justify-content:space-between}.datebar button{border:0;background:#eae3ff;border-radius:13px;padding:10px 14px;color:#6744bd;font-weight:750}.datebar strong{font-size:15px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0 8px}.tab{border:0;border-radius:20px;background:#e9e5f7;color:#66578d;padding:11px 15px;white-space:nowrap;font-weight:750}.tab.active{background:#6f53d4;color:white}.task{background:white;border:2px solid transparent;border-radius:20px;margin:10px 0;padding:14px;display:flex;align-items:center;gap:13px;box-shadow:0 5px 18px #6f55a40c}.task.done{background:#effbf4;border-color:#b3e8c7}.emoji{font-size:29px;background:#f3edff;border-radius:16px;width:53px;height:53px;display:grid;place-items:center;flex-shrink:0}.taskbody{flex:1;min-width:0}.taskbody b{display:block;font-size:16px}.taskbody small{color:#817993;font-size:12px}.check{border:2px solid #c5b8e9;background:#fff;color:#6d50c5;width:43px;height:43px;border-radius:15px;font-size:23px;font-weight:800}.done .check{background:#42bd86;color:white;border-color:#42bd86}.progress{height:13px;border-radius:30px;background:#e8def8;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,#63d2ac,#ffd567);transition:width .2s}.card{background:white;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #6f55a40c}.card h3{margin:0 0 12px}.pill{display:inline-block;border-radius:20px;background:#f2ebff;padding:8px 12px;margin:4px;color:#6348ae;font-weight:700;font-size:13px}.btn{border:0;background:#7353d6;color:white;border-radius:16px;padding:14px 16px;font-weight:800}.btn.secondary{background:#eee7ff;color:#6246b4}.btn.danger{background:#fff0f0;color:#c44c63}.btn:disabled{opacity:.5}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:block;margin:13px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #d8cfee;border-radius:13px;padding:12px;background:#fff;min-height:45px}.days{display:flex;gap:5px;flex-wrap:wrap}.day{padding:9px 8px;border:1px solid #d8cfee;background:#fff;border-radius:12px;min-width:39px}.day.sel{background:#7454d8;color:white}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(580px,100%);display:flex;background:#fff;box-shadow:0 -4px 20px #31234a15;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:4}.nav{flex:1;border:0;background:none;color:#8c82a6;font-size:11px;font-weight:700;padding:5px 0}.nav span{display:block;font-size:24px}.nav.active{color:#7250d2}.empty{text-align:center;padding:30px 10px;color:#877b9c}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#342a5b;color:#fff;border-radius:20px;padding:12px 20px;z-index:9;display:none;box-shadow:0 5px 20px #0002}small.muted{color:#8c83a0}.spark{font-size:21px}.info{font-size:13px;color:#746b86;line-height:1.5}.badge{background:#fff6d9;color:#a16d11;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:750}.taskedit{border-bottom:1px solid #eee7f7;padding:10px 0}.taskedit:last-child{border:0}.taskedit b{font-size:14px}.hide{display:none!important}</style></head><body><div class="app"><header class="hero"><div class="top"><div><div class="eyebrow">YOUR LITTLE ADVENTURE</div><h1>✨ My Starry Day</h1><p id="greeting">Every little step shines!</p></div><div class="spark">🌈🦄</div></div><div class="stars"><div><div class="tiny">YOUR STARS EARNED</div><div class="big" id="stars">0 ⭐</div></div><div><div class="tiny">CURRENT STREAK</div><div class="big" id="streak">0 🔥</div></div></div></header><main id="view"></main><nav class="bottom"><button class="nav active" data-page="today"><span>🏡</span>Today</button><button class="nav" data-page="rewards"><span>🏆</span>Stars</button><button class="nav" data-page="routines"><span>📝</span>Routines</button><button class="nav" data-page="settings"><span>⚙️</span>Settings</button></nav></div><div id="toast" class="toast">Great job! ⭐</div><script>
const KEY='starry-day-v1',DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ALL=[0,1,2,3,4,5,6],WEEK=[1,2,3,4,5];const defaults=[['Wake up & make my bed','🛏️','Morning',ALL],['Brush teeth & wash face','🪥','Morning',ALL],['Get dressed & ready','👕','Morning',WEEK],['Eat breakfast','🥣','Morning',ALL],['Pack my school bag','🎒','Morning',WEEK],['Change out of school clothes','👚','After school',WEEK],['Kumon practice','✏️','After school',WEEK],['Maths practice','🔢','After school',WEEK],['English practice','🔤','After school',WEEK],['Writing practice','📓','After school',WEEK],['Read a book','📚','After school',ALL],['Karate class (choose days)','🥋','After school',[]],['Gymnastics / fun workout','🤸','After school',[1,3,5]],['Help tidy up','🧸','Evening',ALL],['Shower (choose days)','🚿','Evening',[0,2,4,6]],['Dinner','🍽️','Evening',ALL],['Brush teeth','🪥','Evening',ALL],['Get ready for bed','🌙','Evening',ALL]].map((a,i)=>({id:'t'+i,name:a[0],emoji:a[1],period:a[2],days:a[3]}));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tasks)&&x.completed)return x}catch(e){}return {name:'Superstar',tasks:defaults,completed:{},target:10}}let state=load(),page='today',period='All',offset=0;const $=s=>document.querySelector(s),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function dateAt(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function eligible(d){return state.tasks.filter(t=>t.days.includes(d.getDay()))}function done(t,d){return !!(state.completed[dateKey(d)]||{})[t.id]}function counts(d){const ts=eligible(d);return [ts.filter(t=>done(t,d)).length,ts.length]}function totalStars(){return Object.values(state.completed).reduce((a,o)=>a+Object.values(o).filter(Boolean).length,0)}function streak(){let n=0,d=dateAt(0);if(counts(d)[1]===0||counts(d)[0]!==counts(d)[1])d=dateAt(-1);for(let i=0;i<365;i++){let [a,b]=counts(d);if(b===0||a!==b)break;n++;d.setDate(d.getDate()-1)}return n}function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1700)}function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#greeting').textContent=`${state.name}, let's make today amazing!`;$('#stars').textContent=totalStars()+' ⭐';$('#streak').textContent=streak()+' 🔥';let v=$('#view');if(page==='today'){let d=dateAt(offset),[a,b]=counts(d),pct=b?Math.round(a/b*100):0;let list=eligible(d).filter(t=>period==='All'||t.period===period);v.innerHTML=`<div class="section"><div class="datebar"><button id="prev">❮</button><strong>${d.toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</strong><button id="next">❯</button></div><div class="card"><div class="row" style="justify-content:space-between"><b>🌟 Daily mission</b><span class="badge">${a} of ${b} done</span></div><div class="progress"><div class="fill" style="width:${pct}%"></div></div><small class="muted">${pct===100&&b?'Amazing! All missions completed! 🎉':'Tick off each activity to earn a star!'}</small></div><div class="tabs">${['All','Morning','After school','Evening'].map(p=>`<button class="tab ${period===p?'active':''}" data-period="${p}">${p==='Morning'?'🌅 ':p==='After school'?'🎒 ':p==='Evening'?'🌙 ':'✨ '}${p}</button>`).join('')}</div>${list.length?list.map(t=>`<div class="task ${done(t,d)?'done':''}"><div class="emoji">${safe(t.emoji)}</div><div class="taskbody"><b>${safe(t.name)}</b><small>${safe(t.period)} · ⭐ 1 star</small></div><button class="check" data-task="${safe(t.id)}" aria-label="${done(t,d)?'Undo':'Complete'} ${safe(t.name)}">${done(t,d)?'✓':'○'}</button></div>`).join(''):'<div class="empty">🌸 No activities scheduled here.<br>Visit Routines to add some!</div>'}</div>`;$('#prev').onclick=()=>{offset--;render()};$('#next').onclick=()=>{offset++;render()};v.querySelectorAll('[data-period]').forEach(x=>x.onclick=()=>{period=x.dataset.period;render()});v.querySelectorAll('[data-task]').forEach(x=>x.onclick=()=>{const k=dateKey(d),id=x.dataset.task;state.completed[k]??={};state.completed[k][id]=!state.completed[k][id];save();if(state.completed[k][id])toast('Wonderful! You earned a star! ⭐');render()})}
else if(page==='rewards'){let total=totalStars(),thisWeek=Array.from({length:7},(_,i)=>{let d=dateAt(-i);return {d,...{c:counts(d)}}});v.innerHTML=`<div class="section"><div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h2>${total} shiny stars!</h2><p>Every completed activity earns one star. Keep shining!</p><div class="progress"><div class="fill" style="width:${Math.min(100,total%Math.max(1,state.target)/Math.max(1,state.target)*100)}%"></div></div><small class="muted">${total%state.target} / ${state.target} stars towards the next milestone</small></div><h3>📅 Your last 7 days</h3>${thisWeek.map(x=>`<div class="card row" style="justify-content:space-between"><b>${x.d.toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})}</b><span>${x.c[0]} / ${x.c[1]} ⭐</span></div>`).join('')}<div class="card"><h3>💜 A note for parents</h3><p class="info">Stars celebrate effort, not perfection. Enjoy encouraging progress together!</p></div></div>`}
else if(page==='routines'){v.innerHTML=`<div class="section"><h2>📝 My routines</h2><p class="info">Choose which days each activity appears. Karate and showers can be scheduled only on the days you need.</p><div class="card"><h3>➕ Add an activity</h3><div class="field"><label>Activity name</label><input id="newname" maxlength="70" placeholder="e.g. Practice piano"></div><div class="field"><label>Emoji</label><input id="newemoji" maxlength="5" value="🌟"></div><div class="field"><label>Time of day</label><select id="newperiod"><option>Morning</option><option>After school</option><option>Evening</option></select></div><button class="btn" id="addtask">Add activity</button></div>${['Morning','After school','Evening'].map(p=>`<h3>${p==='Morning'?'🌅':p==='After school'?'🎒':'🌙'} ${p}</h3>${state.tasks.filter(t=>t.period===p).map(t=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${safe(t.emoji)} ${safe(t.name)}</b><button class="btn danger" style="padding:8px 10px;font-size:12px" data-remove="${safe(t.id)}">Remove</button></div><div class="days" style="margin-top:13px">${DAYS.map((day,i)=>`<button class="day ${t.days.includes(i)?'sel':''}" data-toggle="${safe(t.id)}" data-day="${i}" aria-label="Toggle ${day}">${day}</button>`).join('')}</div></div>`).join('')}`).join('')}</div>`;$('#addtask').onclick=()=>{let name=$('#newname').value.trim(),emoji=$('#newemoji').value.trim()||'🌟',p=$('#newperiod').value;if(!name)return toast('Enter an activity name first');state.tasks.push({id:'t'+Date.now(),name,emoji,period:p,days:[...ALL]});save();render();toast('Activity added!')};v.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{let t=state.tasks.find(t=>t.id===x.dataset.toggle),day=+x.dataset.day;t.days=t.days.includes(day)?t.days.filter(z=>z!==day):[...t.days,day].sort();save();render()});v.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{if(confirm('Remove this activity from the routine?')){state.tasks=state.tasks.filter(t=>t.id!==x.dataset.remove);save();render()}})}
else{v.innerHTML=`<div class="section"><h2>⚙️ Grown-up settings</h2><div class="card"><div class="field"><label>Child's display name</label><input id="childname" maxlength="35" value="${safe(state.name)}"></div><div class="field"><label>Stars per milestone</label><input id="target" type="number" min="1" max="100" value="${state.target}"></div><button class="btn" id="saveprefs">Save settings</button></div><div class="card"><h3>💾 Keep your progress safe</h3><p class="info">This app saves on this device only. Export a backup regularly, especially before changing phones or clearing website data.</p><div class="row"><button class="btn secondary" id="export">⬇ Export backup</button><label class="btn secondary" style="display:inline-block">⬆ Restore backup<input type="file" id="import" accept="application/json,.json" class="hide"></label></div></div><div class="card"><h3>🔒 Privacy</h3><p class="info">No login, advertisements, bank connection, or cloud syncing. Data stays in this browser's local storage unless you export it. If you delete the app or browser data, progress may be lost.</p></div></div>`;$('#saveprefs').onclick=()=>{state.name=$('#childname').value.trim()||'Superstar';state.target=Math.max(1,Math.min(100,Number($('#target').value)||10));save();render();toast('Settings saved!')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'My Starry Day',version:1,data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='starry-day-backup-'+dateKey(dateAt(0))+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)};$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.app!=='My Starry Day'||!j.data||!Array.isArray(j.data.tasks)||!j.data.completed)throw Error('Invalid backup');if(confirm('Restore backup? This replaces the current progress on this device.')){state=j.data;save();render();toast('Backup restored!')}}catch(err){alert('This does not look like a valid My Starry Day backup.')}}}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
